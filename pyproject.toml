[project]
name = "advanced-agent"
version = "0.1.0"
description = "A clean local agent architecture prototype with main reasoning agent, fast buffer, task agents, and memory maintenance."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.27",
  "prompt_toolkit>=3.0",
  "sqlite-vec>=0.1.9",
]

[project.scripts]
codexx = "advanced_agent.codex_interactive:main"
advanced-agentd = "advanced_agent.daemon:main"
advanced-agent-codex = "advanced_agent.codex_interactive:main"
advanced-agent-mcp = "advanced_agent.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
