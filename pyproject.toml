[project]
name = "advanced-agent"
version = "0.1.3"
description = "A local memory/runtime wrapper for Codex and other external agent clients."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.27",
  "sqlite-vec>=0.1.9",
]

[project.scripts]
codexx = "advanced_agent.codex_interactive:main"
advanced-agentd = "advanced_agent.daemon:main"
advanced-agent-mcp = "advanced_agent.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
